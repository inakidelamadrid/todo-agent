# Postgres 17 and Redis 7 for local development.
# All credentials come from --env-file .env.db (gitignored); nothing is hardcoded.
name: todo-agent

services:
  postgres:
    image: postgres:17.12-alpine3.24
    restart: unless-stopped
    env_file: .env.db
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4.12-alpine3.22
    restart: unless-stopped
    env_file: .env.db
    # Password read from container env at start, so it never appears in this
    # file or in `docker compose config` output.
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12

  n8n:
    image: n8nio/n8n:2.49.8        # exact stable tag; check Docker Hub when bumping
    profiles: [n8n]
    restart: unless-stopped
    env_file: .env.n8n
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  redis_data:
  n8n_data:
