[project]
name = "todo-agent-api"
version = "0.1.0"
description = "todo-agent backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2",
    "asyncpg>=0.32.0",
    "alembic>=1.20.1",
    "aiogram>=3.32.0",
    "pyjwt[crypto]>=2.15.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.6",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
